version: "3.8"

services:

  # ─────────────────────────────────────────
  # Banco de dados PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-twixeventos}
      POSTGRES_USER:     ${POSTGRES_USER:-twix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - twix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twix} -d ${POSTGRES_DB:-twixeventos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twix_net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s

  # ─────────────────────────────────────────
  # Aplicação Next.js
  # ─────────────────────────────────────────
  app:
    image: ghcr.io/danielsjcampos/twixeventos:latest
    environment:
      DATABASE_URL:                postgresql://${POSTGRES_USER:-twix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-twixeventos}
      NEXTAUTH_URL:                ${NEXTAUTH_URL}
      NEXTAUTH_SECRET:             ${NEXTAUTH_SECRET}
      AUTH_SECRET:                 ${AUTH_SECRET}
      RESEND_API_KEY:              ${RESEND_API_KEY}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      CRON_SECRET:                 ${CRON_SECRET}
    volumes:
      - twix_uploads:/app/public/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - twix_net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

volumes:
  twix_pgdata:
    driver: local
  twix_uploads:
    driver: local

networks:
  twix_net:
    driver: overlay
    attachable: true
